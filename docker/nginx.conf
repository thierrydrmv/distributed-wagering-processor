events {}

http {
    upstream wagering_backend {
        server app:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://wagering_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;

            # Facilita verificar qual réplica respondeu.
            add_header X-Upstream-Address $upstream_addr always;

            # Evita reenviar automaticamente uma operação
            # para outra réplica durante falhas.
            proxy_next_upstream off;
        }
    }
}